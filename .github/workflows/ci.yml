# claude-foundation `docs-only` profili — kalite kapısı (mermaid doğrulama; üretim kodu yok).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: kalite kapısı (.claude/quality.json → verify)
        run: bash .claude/scripts/verify.sh --strict
